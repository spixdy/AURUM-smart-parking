[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-parking"
version = "1.0.0"
description = "Delhi parking occupancy forecasting: model, MQTT pipeline, dashboards"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["aurum"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "I001"]
"scripts/browser_audit.py" = ["E501", "F401", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
