name: Deploy to Azure

# Manual. Requires repository secrets: AZURE_CREDENTIALS (service-principal JSON),
# and repository variables: AZURE_WEBAPP_NAME, AZURE_CONTAINER_REGISTRY (e.g. aurumacr.azurecr.io).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push to Azure Container Registry
        run: |
          az acr build --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
            --image aurum:${{ github.sha }} .
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY }}/aurum:${{ github.sha }}
